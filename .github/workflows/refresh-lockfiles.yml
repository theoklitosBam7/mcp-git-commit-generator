name: Refresh upgrade lockfiles

on:
  push:
    branches: [upgrade/mcp-2026-07-28]

permissions:
  contents: write

concurrency:
  group: refresh-upgrade-lockfiles
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: upgrade/mcp-2026-07-28

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: inspector/package-lock.json

      - name: Refresh Python lockfile
        run: uv lock --upgrade

      - name: Refresh Inspector lockfile
        working-directory: inspector
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        shell: bash
        run: |
          if git diff --quiet -- uv.lock inspector/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock inspector/package-lock.json
          git commit -m "chore: refresh dependency lockfiles"
          git push origin HEAD:upgrade/mcp-2026-07-28
