name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Python checks
        uses: ./.github/actions/test-python

      - name: Audit Python dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: uv run pip-audit --local

      - name: Build distributions
        if: runner.os == 'Linux'
        shell: bash
        run: uv build

  inspector:
    name: Inspector dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: inspector/package-lock.json

      - name: Install locked Inspector dependencies
        working-directory: inspector
        run: npm ci --ignore-scripts

      - name: Audit Inspector dependencies
        working-directory: inspector
        run: npm audit --audit-level=high
